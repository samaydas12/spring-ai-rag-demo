<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAG Demo</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, system-ui, sans-serif;
    max-width: 640px;
    margin: 0 auto;
    padding: 20px;
    background: #0f1115;
    color: #e8e8e8;
  }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  .subtitle { color: #999; font-size: 0.9rem; margin-bottom: 24px; }
  .card {
    background: #1a1d24;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 18px;
    border: 1px solid #2a2e38;
  }
  .card h2 { font-size: 1rem; margin: 0 0 10px 0; color: #8ab4f8; }
  textarea, input {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #333;
    background: #0f1115;
    color: #e8e8e8;
    font-size: 0.95rem;
    resize: vertical;
  }
  textarea { min-height: 100px; }
  button {
    margin-top: 10px;
    padding: 10px 18px;
    border: none;
    border-radius: 8px;
    background: #8ab4f8;
    color: #0f1115;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
    width: 100%;
  }
  button:disabled { opacity: 0.5; }
  .status { margin-top: 10px; font-size: 0.85rem; color: #999; min-height: 20px; }
  .answer-box {
    margin-top: 12px;
    padding: 12px;
    background: #0f1115;
    border-radius: 8px;
    border-left: 3px solid #8ab4f8;
    white-space: pre-wrap;
    font-size: 0.95rem;
    line-height: 1.5;
  }
  .config { font-size: 0.8rem; color: #666; margin-top: 24px; text-align: center; }
  .config input { display: inline-block; width: auto; font-size: 0.75rem; padding: 4px 8px; }
</style>
</head>
<body>

<h1>🔍 RAG Demo</h1>
<div class="subtitle">Spring AI + Gemini + pgvector</div>

<div class="card">
  <h2>১. তথ্য যোগ করো (Ingest)</h2>
  <textarea id="ingestText" placeholder="যেমন: Employees get 12 casual leaves per year. Sick leave is 10 days annually."></textarea>
  <button id="ingestBtn" onclick="ingest()">Ingest করো</button>
  <div class="status" id="ingestStatus"></div>
</div>

<div class="card">
  <h2>২. প্রশ্ন করো (Ask)</h2>
  <input id="questionInput" placeholder="যেমন: How many casual leaves do I get?">
  <button id="askBtn" onclick="ask()">প্রশ্ন করো</button>
  <div class="status" id="askStatus"></div>
  <div id="answerBox" class="answer-box" style="display:none;"></div>
</div>

<div class="card">
  <h2>৩. Agent-কে কাজ করতে বলো</h2>
  <input id="agentInput" placeholder="যেমন: How many leaves does E102 have? Apply 1 day if any left.">
  <button id="agentBtn" onclick="askAgent()">Agent-কে বলো</button>
  <div class="status" id="agentStatus"></div>
  <div id="agentAnswerBox" class="answer-box" style="display:none;"></div>
</div>

<div class="config">
  Backend URL: <input id="baseUrl" value="https://spring-ai-rag-demo.onrender.com">
  <br>(free tier ঘুমিয়ে থাকলে প্রথম request-এ ৩০-৫০ সেকেন্ড লাগতে পারে)
</div>

<script>
function getBaseUrl() {
  return document.getElementById('baseUrl').value.trim().replace(/\/$/, '');
}

async function ingest() {
  const text = document.getElementById('ingestText').value.trim();
  const statusEl = document.getElementById('ingestStatus');
  const btn = document.getElementById('ingestBtn');
  if (!text) { statusEl.textContent = '⚠️ কিছু টেক্সট লেখো।'; return; }

  btn.disabled = true;
  statusEl.textContent = '⏳ Ingest হচ্ছে...';

  try {
    const res = await fetch(`${getBaseUrl()}/api/rag/ingest`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text })
    });
    if (!res.ok) throw new Error(`Server error: ${res.status}`);
    const data = await res.json();
    statusEl.textContent = `✅ Ingested! (status: ${data.status})`;
    document.getElementById('ingestText').value = '';
  } catch (err) {
    statusEl.textContent = `❌ ভুল হয়েছে: ${err.message}`;
  } finally {
    btn.disabled = false;
  }
}

async function ask() {
  const question = document.getElementById('questionInput').value.trim();
  const statusEl = document.getElementById('askStatus');
  const answerBox = document.getElementById('answerBox');
  const btn = document.getElementById('askBtn');
  if (!question) { statusEl.textContent = '⚠️ একটা প্রশ্ন লেখো।'; return; }

  btn.disabled = true;
  statusEl.textContent = '⏳ উত্তর খোঁজা হচ্ছে...';
  answerBox.style.display = 'none';

  try {
    const url = `${getBaseUrl()}/api/rag/ask?question=${encodeURIComponent(question)}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`Server error: ${res.status}`);
    const data = await res.json();
    statusEl.textContent = '';
    answerBox.textContent = data.answer;
    answerBox.style.display = 'block';
  } catch (err) {
    statusEl.textContent = `❌ ভুল হয়েছে: ${err.message}`;
  } finally {
    btn.disabled = false;
  }
}
async function askAgent() {
  const question = document.getElementById('agentInput').value.trim();
  const statusEl = document.getElementById('agentStatus');
  const answerBox = document.getElementById('agentAnswerBox');
  const btn = document.getElementById('agentBtn');
  if (!question) { statusEl.textContent = '⚠️ একটা প্রশ্ন/নির্দেশ লেখো।'; return; }

  btn.disabled = true;
  statusEl.textContent = '⏳ Agent কাজ করছে...';
  answerBox.style.display = 'none';

  try {
    const url = `${getBaseUrl()}/api/agent/ask?question=${encodeURIComponent(question)}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`Server error: ${res.status}`);
    const data = await res.json();
    statusEl.textContent = '';
    answerBox.textContent = data.answer;
    answerBox.style.display = 'block';
  } catch (err) {
    statusEl.textContent = `❌ ভুল হয়েছে: ${err.message}`;
  } finally {
    btn.disabled = false;
  }
}
</script>

</body>
</html>
