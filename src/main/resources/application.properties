spring.application.name=rag-demo

# ---- LLM (chat) provider: Anthropic Claude ----
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}
spring.ai.anthropic.chat.options.model=claude-sonnet-4-5

# ---- Embedding provider: OpenAI ----
# (Anthropic doesn't expose an embeddings endpoint, so OpenAI's
#  embedding model is used just for turning text into vectors)
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.embedding.options.model=text-embedding-3-small

# Since we only want OpenAI for embeddings, not chat, disable its chat auto-config
spring.ai.openai.chat.enabled=false

# ---- Vector store: Postgres + pgvector ----
spring.datasource.url=jdbc:postgresql://localhost:5432/ragdb
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=1536
spring.ai.vectorstore.pgvector.initialize-schema=true

server.port=8080
