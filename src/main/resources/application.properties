spring.application.name=rag-demo

# ---- Google Gemini: one key for BOTH chat and embeddings ----
# (Free tier available via aistudio.google.com/apikey)
spring.ai.model.chat=google-genai
spring.ai.model.embedding=google-genai

spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-2.5-flash
spring.ai.google.genai.embedding.text.options.model=text-embedding-004

# ---- Vector store: Postgres + pgvector ----
spring.datasource.url=jdbc:postgresql://localhost:5432/ragdb
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
# text-embedding-004 outputs 768-dimensional vectors — must match this exactly
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.initialize-schema=true

server.port=${PORT:8080}
